name: Download Video

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL'
        required: true
        type: string
      quality:
        description: 'Quality'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 1080
          - 720
          - 480
          - 360
          - 240
          - 144
          - worst
      password:
        description: 'Password'
        required: false
        type: string
      cookies:
        description: 'Cookies'
        required: false
        type: string

jobs:
  download:
    name: "Fetch Video"
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      VIDEO_URL: ${{ github.event.inputs.video_url }}
      QUALITY: ${{ github.event.inputs.quality }}
      USER_PASS: ${{ github.event.inputs.password }}
      COOKIES_TXT: ${{ github.event.inputs.cookies }}

    steps:
      - name: Start Cloudflare WARP
        run: |
          docker network create warp-net || true
          docker run -d --name warp --restart=always --network warp-net -p 1080:1080 --cap-add NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0 --sysctl net.ipv4.conf.all.src_valid_mark=1 caomingjun/warp
          sleep 5

      - name: Setup yt-dlp binary (Nightly Release)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg p7zip-full jq curl
          sudo wget -q https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp_linux -O /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download Video
        run: |
          mkdir -p downloaded_video
          
          if [ -n "$COOKIES_TXT" ]; then
            echo "$COOKIES_TXT" > cookies.txt
            sed -i 's/\r$//' cookies.txt
          else
            touch cookies.txt
          fi
          
          if [ "$QUALITY" = "best" ]; then
            FORMAT="bestvideo+bestaudio/best"
          elif [ "$QUALITY" = "worst" ]; then
            FORMAT="worstvideo+worstaudio/worst"
          else
            FORMAT="bestvideo[height<=$QUALITY]+bestaudio/best[height<=$QUALITY]/best"
          fi

          SUCCESS=false
          set +e
          ARGS=(
            "--format" "$FORMAT"
            "--merge-output-format" "mp4"
            "--restrict-filenames"
            "--no-playlist"
            "-o" "downloaded_video/%(title)s.%(ext)s"
            "--no-check-certificates"
            "--impersonate" "chrome"
            "--referer" "$VIDEO_URL"
          )
          if [ -s cookies.txt ]; then ARGS+=("--cookies" "cookies.txt"); fi
          ARGS+=("$VIDEO_URL")
          yt-dlp "${ARGS[@]}"
          if [ $? -eq 0 ]; then
            SUCCESS=true
          else
            PROXY_ARGS=("--proxy" "socks5://127.0.0.1:1080" "${ARGS[@]}")
            yt-dlp "${PROXY_ARGS[@]}"
            if [ $? -eq 0 ]; then
              SUCCESS=true
            else
              cat << 'PYEOF' > run_bypass.py
import subprocess
import sys
url = sys.argv[1]
cmd = [
    "yt-dlp",
    "--merge-output-format", "mp4",
    "--restrict-filenames",
    "-o", "downloaded_video/%(title)s.%(ext)s",
    "--no-check-certificates",
    "--add-header", "User-Agent:Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
    url
]
if sys.argv[2] == 'true':
    cmd.insert(1, "--cookies")
    cmd.insert(2, "cookies.txt")
subprocess.run(cmd)
PYEOF
              HAS_COOKIES="false"
              if [ -s cookies.txt ]; then HAS_COOKIES="true"; fi
              python3 run_bypass.py "$VIDEO_URL" "$HAS_COOKIES"
              if [ $? -eq 0 ]; then SUCCESS=true; fi
            fi
          fi
          set -e
          
          FILE_COUNT=$(ls -1q downloaded_video | wc -l || echo 0)
          if [ "$FILE_COUNT" -eq 0 ] || [ "$SUCCESS" = false ]; then exit 1; fi

      - name: Encrypt Video
        id: encrypt
        run: |
          FILE_PATH=$(find downloaded_video -type f | head -n 1)
          if [ -z "$FILE_PATH" ]; then exit 1; fi
          if [ -z "$USER_PASS" ]; then PASS=$(openssl rand -hex 4); else PASS="$USER_PASS"; fi
          7z a -p"$PASS" -mhe=on downloaded_video/Secure_Video.7z "$FILE_PATH"
          shred -u "$FILE_PATH" || rm -f "$FILE_PATH"
          echo "password=$PASS" >> $GITHUB_OUTPUT

      - name: Upload to Ephemeral Storage
        run: |
          set +e
          FILE_PATH="downloaded_video/Secure_Video.7z"
          PASS="${{ steps.encrypt.outputs.password }}"
          SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name' || echo "store1")
          GOFILE_RESP=$(curl -s -F file=@"$FILE_PATH" "https://${SERVER}.gofile.io/contents/uploadfile")
          GOFILE_LINK=$(echo "$GOFILE_RESP" | jq -r '.data.downloadPage' 2>/dev/null || echo "")
          if [ -n "$GOFILE_LINK" ] && [ "$GOFILE_LINK" != "null" ]; then
            echo "GOFILE LINK: $GOFILE_LINK"
          else
            BASH_LINK=$(curl -s -F "file=@$FILE_PATH" https://0x0.st || echo "")
            echo "0x0.st LINK: $BASH_LINK"
          fi
          echo "رمز عبور فایل شما برای استخراج: $PASS"
          shred -u "$FILE_PATH" || rm -f "$FILE_PATH"
          set -e
