name: 🎬 Download Video (Ultra Reliable + Auto-Delete)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '🔗 لینک صفحه یا ویدیو'
        required: true
        type: string
      quality:
        description: '🎬 کیفیت ویدیو (best=بهترین, worst=پایین‌ترین)'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 1080
          - 720
          - 480
          - 360
          - 240
          - 144
          - worst

jobs:
  download:
    name: "📥 Fetch Video"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Start Cloudflare WARP (Anti-Block)
        run: |
          docker network create warp-net || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp
          sleep 15

      - name: Install Dependencies (Deno & yt-dlp)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg curl jq
          
          # نصب Deno برای رفع خطاهای جاوااسکریپت سایت‌ها (مخصوصا یوتیوب)
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          
          # نسخه Master برای بیشترین پایداری
          pip3 install --upgrade git+https://github.com/yt-dlp/yt-dlp.git

      - name: Download Video (Ultimate Reliability)
        run: |
          mkdir -p downloaded_video
          export PATH="$HOME/.deno/bin:$PATH"
          
          URL="${{ github.event.inputs.video_url }}"
          QUAL="${{ github.event.inputs.quality }}"
          
          # تنظیم دقیق کیفیت بر اساس انتخاب کاربر (از بهترین تا پایین‌ترین)
          if [ "$QUAL" = "best" ]; then
            FORMAT="bestvideo+bestaudio/best"
          elif [ "$QUAL" = "worst" ]; then
            FORMAT="worstvideo+worstaudio/worst"
          else
            FORMAT="bestvideo[height<=$QUAL]+bestaudio/best[height<=$QUAL]/best"
          fi

          echo "Target URL: $URL"
          echo "Selected Quality: $QUAL"

          FLAGS="--format $FORMAT --merge-output-format mp4 --restrict-filenames --no-playlist -o downloaded_video/%(title)s.%(ext)s --no-check-certificates"
          
          SUCCESS=false
          
          # روش اول: استفاده از کلاینت اندروید + پروکسی WARP (بیشترین احتمال موفقیت)
          echo "▶️ Trying Method 1 (Android Client + WARP)..."
          if yt-dlp --proxy "socks5://127.0.0.1:1080" $FLAGS --extractor-args "youtube:player_client=android" "$URL"; then
            SUCCESS=true
          fi
          
          # روش دوم: استفاده از Deno + پروکسی WARP (اگه سایت ضد ربات قوی داشت)
          if [ "$SUCCESS" = false ]; then
            echo "▶️ Trying Method 2 (Web Client + Deno + WARP)..."
            if yt-dlp --proxy "socks5://127.0.0.1:1080" $FLAGS --extractor-args "youtube:player_client=web" --js-runtimes deno "$URL"; then
              SUCCESS=true
            fi
          fi
          
          # روش سوم: دایرکت (بدون پروکسی) - برای سایت‌هایی که پروکسی‌ها رو بلاک می‌کنن (مثل بعضی سایت‌های ایرانی)
          if [ "$SUCCESS" = false ]; then
            echo "▶️ Trying Method 3 (Direct / No Proxy)..."
            if yt-dlp $FLAGS "$URL"; then
              SUCCESS=true
            fi
          fi
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ All download methods failed. Video might be private or region-locked."
            exit 1
          fi

      - name: Upload to Ephemeral Storage (Auto-Delete)
        run: |
          FILE_PATH=$(ls downloaded_video/* | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "❌ No file found to upload!"
            exit 1
          fi
          
          FILENAME=$(basename "$FILE_PATH")
          echo "📤 Uploading $FILENAME to temp storage..."
          
          # اولویت ۱: transfer.sh (انفجار بعد از ۱ بار دانلود)
          LINK=$(curl -s -H "Max-Downloads: 1" -H "Max-Days: 1" --upload-file "$FILE_PATH" "https://transfer.sh/$FILENAME")
          
          if [[ "$LINK" == http* ]]; then
            echo "=========================================================="
            echo "✅ TRANSFER.SH LINK: $LINK"
            echo "⚠️ این لینک بعد از [یک بار دانلود] به صورت خودکار برای همیشه پاک می‌شود!"
            echo "=========================================================="
          else
            # اولویت ۲: bashupload (در صورت قطعی سرور اول)
            echo "transfer.sh failed or was slow, trying bashupload..."
            BASH_LINK=$(curl -s -T "$FILE_PATH" https://bashupload.com/$FILENAME | grep -oP 'https://bashupload.com/[^\s]+' | head -n 1)
            echo "=========================================================="
            echo "✅ BASHUPLOAD LINK: $BASH_LINK"
            echo "⚠️ این سرور جایگزین است. ویدیو به صورت خودکار منقضی می‌شود."
            echo "=========================================================="
          fi
          
          # پاک کردن کامل فایل از روی سرور گیت‌هاب با shred (غیرقابل ریکاوری)
          echo "🧹 Securely shredding the file from GitHub server..."
          shred -u "$FILE_PATH" || rm -f "$FILE_PATH"

      - name: Wipe Workspace Traces
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true
          rm -rf downloaded_video/
