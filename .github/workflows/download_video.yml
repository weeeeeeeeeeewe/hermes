name: 🎬 Download Video (Ultra Fast + Cookies Fix)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '🔗 لینک صفحه یا ویدیو'
        required: true
        type: string
      quality:
        description: '🎬 کیفیت ویدیو'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 1080
          - 720
          - 480
          - 360
          - 240
          - 144
          - worst
      password:
        description: '🔒 رمز عبور فایل (اگر خالی بگذارید، رمز تصادفی ساخته می‌شود)'
        required: false
        type: string
      cookies:
        description: '🍪 کوکی (اختیاری - محتویات فایل cookies.txt را اینجا Paste کنید)'
        required: false
        type: string

jobs:
  download:
    name: "📥 Fetch & Encrypt Video"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      VIDEO_URL: ${{ github.event.inputs.video_url }}
      QUALITY: ${{ github.event.inputs.quality }}
      USER_PASS: ${{ github.event.inputs.password }}
      COOKIES_TXT: ${{ github.event.inputs.cookies }}

    steps:
      - name: Start Cloudflare WARP
        run: |
          docker network create warp-net || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp
          sleep 10

      - name: Fast Setup (Impersonation Libs + Master yt-dlp)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          
          python3 -m pip install --user --upgrade git+https://github.com/yt-dlp/yt-dlp.git curl-cffi requests --break-system-packages || python3 -m pip install --user --upgrade git+https://github.com/yt-dlp/yt-dlp.git curl-cffi requests
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Download Video (Private Site Optimized)
        run: |
          mkdir -p downloaded_video
          
          URL="$VIDEO_URL"
          QUAL="$QUALITY"
          
          if [ -n "$COOKIES_TXT" ]; then
            echo "$COOKIES_TXT" > cookies.txt
            sed -i 's/\r$//' cookies.txt
            COOKIE_FLAG="--cookies cookies.txt"
            echo "🍪 Cookies loaded for Private Site authentication!"
          else
            COOKIE_FLAG=""
          fi
          
          if [ "$QUAL" = "best" ]; then
            FORMAT="bestvideo+bestaudio/best"
          elif [ "$QUAL" = "worst" ]; then
            FORMAT="worstvideo+worstaudio/worst"
          else
            FORMAT="bestvideo[height<=$QUAL]+bestaudio/best[height<=$QUAL]/best"
          fi

          # FIXED: Used an array array to properly handle spaces and quotes without bash eval errors
          # Also added --verbose for better debugging if it fails again
          
          SPOOF_UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
          
          # We use normal arrays and command execution instead of dangerous eval strings
          SUCCESS=false
          
          echo "=========================================================="
          echo "▶️ Method 1: Direct Mode (Private Site Mode)..."
          if yt-dlp --format "$FORMAT" --merge-output-format mp4 --restrict-filenames --no-playlist -o "downloaded_video/%(title)s.%(ext)s" --no-check-certificates --user-agent "$SPOOF_UA" --referer "$URL" ${COOKIE_FLAG:+--cookies cookies.txt} "$URL"; then
            SUCCESS=true
          else
            echo "=========================================================="
            echo "▶️ Method 2: Direct Mode + Browser Impersonation..."
            if yt-dlp --format "$FORMAT" --merge-output-format mp4 --restrict-filenames --no-playlist -o "downloaded_video/%(title)s.%(ext)s" --no-check-certificates --user-agent "$SPOOF_UA" --referer "$URL" --impersonate "chrome" ${COOKIE_FLAG:+--cookies cookies.txt} "$URL"; then
              SUCCESS=true
            else
              echo "=========================================================="
              echo "▶️ Method 3: WARP Proxy (In case site blocks GitHub IPs)..."
              if yt-dlp --proxy "socks5://127.0.0.1:1080" --format "$FORMAT" --merge-output-format mp4 --restrict-filenames --no-playlist -o "downloaded_video/%(title)s.%(ext)s" --no-check-certificates --user-agent "$SPOOF_UA" --referer "$URL" ${COOKIE_FLAG:+--cookies cookies.txt} "$URL"; then
                SUCCESS=true
              fi
            fi
          fi
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ All download methods failed."
            echo "⚠️ اگر کوکی درست است اما دانلود نمیشود، احتمالاً سایت 'IP Binding' دارد (یعنی کوکی شما فقط روی IP اینترنت خودتان کار میکند و سرور گیت‌هاب را مسدود میکند)."
            exit 1
          fi

      - name: Encrypt Video (Zero-Knowledge Security)
        id: encrypt
        run: |
          FILE_PATH=$(find downloaded_video -type f | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "❌ No file found!"
            exit 1
          fi
          
          if [ -z "$USER_PASS" ]; then
            PASS=$(openssl rand -hex 4)
          else
            PASS="$USER_PASS"
          fi
          
          echo "🔒 Encrypting file with AES-256..."
          7z a -p"$PASS" -mhe=on downloaded_video/Secure_Video.7z "$FILE_PATH"
          
          shred -u "$FILE_PATH" || rm -f "$FILE_PATH"
          echo "password=$PASS" >> $GITHUB_OUTPUT

      - name: Upload to Ephemeral Storage
        run: |
          set +e
          FILE_PATH="downloaded_video/Secure_Video.7z"
          PASS="${{ steps.encrypt.outputs.password }}"
          
          echo "▶️ Trying File.io..."
          FILEIO_RESP=$(curl -s -F "file=@$FILE_PATH" https://file.io || echo "")
          FILEIO_LINK=$(echo "$FILEIO_RESP" | jq -r '.link' 2>/dev/null || echo "")
          
          if [ -n "$FILEIO_LINK" ] && [ "$FILEIO_LINK" != "null" ] && [[ "$FILEIO_LINK" == http* ]]; then
            echo "=========================================================="
            echo "✅ FILE.IO LINK: $FILEIO_LINK"
            echo "⚠️ این لینک بعد از [یک بار دانلود] پاک می‌شود!"
          else
            echo "▶️ Trying GoFile.io..."
            SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name' 2>/dev/null || echo "")
            if [ -n "$SERVER" ] && [ "$SERVER" != "null" ]; then
              GOFILE_RESP=$(curl -s -F "file=@$FILE_PATH" "https://${SERVER}.gofile.io/contents/uploadfile" || echo "")
              GOFILE_LINK=$(echo "$GOFILE_RESP" | jq -r '.data.downloadPage' 2>/dev/null || echo "")
              
              if [ -n "$GOFILE_LINK" ] && [ "$GOFILE_LINK" != "null" ] && [[ "$GOFILE_LINK" == http* ]]; then
                echo "=========================================================="
                echo "✅ GOFILE LINK: $GOFILE_LINK"
              else
                echo "▶️ Trying BashUpload..."
                BASH_LINK=$(curl -s -T "$FILE_PATH" https://bashupload.com/ | grep -oP 'https://bashupload.com/[^\s]+' | head -n 1 || echo "")
                echo "=========================================================="
                echo "✅ BASHUPLOAD LINK: $BASH_LINK"
              fi
            else
              echo "▶️ Trying BashUpload..."
              BASH_LINK=$(curl -s -T "$FILE_PATH" https://bashupload.com/ | grep -oP 'https://bashupload.com/[^\s]+' | head -n 1 || echo "")
              echo "=========================================================="
              echo "✅ BASHUPLOAD LINK: $BASH_LINK"
            fi
          fi
          
          echo "=========================================================="
          echo "🔑 رمز عبور فایل شما برای استخراج: $PASS"
          echo "=========================================================="
          
          shred -u "$FILE_PATH" || rm -f "$FILE_PATH"
          set -e

      - name: Wipe Workspace Traces
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true
          rm -rf downloaded_video/
          rm -f cookies.txt
