name: 🎬 Download Video (Dockerized Impersonation)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '🔗 لینک صفحه یا ویدیو'
        required: true
        type: string
      quality:
        description: '🎬 کیفیت ویدیو'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 1080
          - 720
          - 480
          - 360
          - 240
          - 144
          - worst
      password:
        description: '🔒 رمز عبور فایل (اگر خالی بگذارید، رمز تصادفی ساخته می‌شود)'
        required: false
        type: string
      cookies:
        description: '🍪 کوکی (اختیاری - محتویات فایل cookies.txt را اینجا Paste کنید)'
        required: false
        type: string

jobs:
  download:
    name: "📥 Fetch & Encrypt Video"
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    env:
      VIDEO_URL: ${{ github.event.inputs.video_url }}
      QUALITY: ${{ github.event.inputs.quality }}
      USER_PASS: ${{ github.event.inputs.password }}
      COOKIES_TXT: ${{ github.event.inputs.cookies }}

    steps:
      - name: Start Cloudflare WARP
        run: |
          docker network create warp-net || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp
          sleep 5

      - name: Prepare Workspace and Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full jq
          mkdir -p downloaded_video
          chmod 777 downloaded_video

      - name: Download Video (Dockerized yt-dlp)
        run: |
          if [ -n "$COOKIES_TXT" ]; then
            echo "$COOKIES_TXT" > cookies.txt
            sed -i 's/\r$//' cookies.txt
            COOKIE_CMD="--cookies /workdir/cookies.txt"
            echo "🍪 Cookies loaded for Private Site authentication!"
          else
            COOKIE_CMD=""
            touch cookies.txt
          fi
          
          if [ "$QUALITY" = "best" ]; then
            FORMAT="bestvideo+bestaudio/best"
          elif [ "$QUALITY" = "worst" ]; then
            FORMAT="worstvideo+worstaudio/worst"
          else
            FORMAT="bestvideo[height<=$QUALITY]+bestaudio/best[height<=$QUALITY]/best"
          fi

          SUCCESS=false
          
          # Pull the official nightly image which has curl_cffi bundled and working
          docker pull jauderho/yt-dlp:latest
          
          echo "=========================================================="
          echo "▶️ Method 1: Dockerized Impersonation Mode..."
          
          set +e
          # Run yt-dlp inside docker
          docker run --rm -v "$(pwd):/workdir" jauderho/yt-dlp:latest \
            --format "$FORMAT" --merge-output-format "mp4" --restrict-filenames --no-playlist \
            -o "/workdir/downloaded_video/%(title)s.%(ext)s" \
            --no-check-certificates \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
            --impersonate "chrome" \
            --referer "$VIDEO_URL" \
            $COOKIE_CMD "$VIDEO_URL"
            
          if [ $? -eq 0 ]; then
            SUCCESS=true
          else
            echo "=========================================================="
            echo "▶️ Method 2: Dockerized WARP Proxy Mode..."
            docker run --rm --network warp-net -v "$(pwd):/workdir" jauderho/yt-dlp:latest \
              --proxy "socks5://warp:1080" --format "$FORMAT" --merge-output-format "mp4" --restrict-filenames --no-playlist \
              -o "/workdir/downloaded_video/%(title)s.%(ext)s" \
              --no-check-certificates \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" \
              --impersonate "chrome" \
              --referer "$VIDEO_URL" \
              $COOKIE_CMD "$VIDEO_URL"
              
            if [ $? -eq 0 ]; then
              SUCCESS=true
            fi
          fi
          set -e
          
          # Check if the file was actually downloaded
          FILE_COUNT=$(ls -1q downloaded_video | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "❌ Download failed or file not saved."
            exit 1
          fi

      - name: Encrypt Video (Zero-Knowledge Security)
        id: encrypt
        run: |
          FILE_PATH=$(find downloaded_video -type f | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "❌ No file found!"
            exit 1
          fi
          
          if [ -z "$USER_PASS" ]; then
            PASS=$(openssl rand -hex 4)
          else
            PASS="$USER_PASS"
          fi
          
          echo "🔒 Encrypting file with AES-256..."
          7z a -p"$PASS" -mhe=on downloaded_video/Secure_Video.7z "$FILE_PATH"
          
          shred -u "$FILE_PATH" || rm -f "$FILE_PATH"
          echo "password=$PASS" >> $GITHUB_OUTPUT

      - name: Upload to Ephemeral Storage
        run: |
          set +e
          FILE_PATH="downloaded_video/Secure_Video.7z"
          PASS="${{ steps.encrypt.outputs.password }}"
          
          echo "▶️ Trying File.io..."
          FILEIO_RESP=$(curl -s -F "file=@$FILE_PATH" https://file.io || echo "")
          FILEIO_LINK=$(echo "$FILEIO_RESP" | jq -r '.link' 2>/dev/null || echo "")
          
          if [ -n "$FILEIO_LINK" ] && [ "$FILEIO_LINK" != "null" ] && [[ "$FILEIO_LINK" == http* ]]; then
            echo "=========================================================="
            echo "✅ FILE.IO LINK: $FILEIO_LINK"
            echo "⚠️ این لینک بعد از [یک بار دانلود] پاک می‌شود!"
          else
            echo "▶️ Trying BashUpload..."
            BASH_LINK=$(curl -s -T "$FILE_PATH" https://bashupload.com/ | grep -oP 'https://bashupload.com/[^\s]+' | head -n 1 || echo "")
            echo "=========================================================="
            echo "✅ BASHUPLOAD LINK: $BASH_LINK"
          fi
          
          echo "=========================================================="
          echo "🔑 رمز عبور فایل شما برای استخراج: $PASS"
          echo "=========================================================="
          
          shred -u "$FILE_PATH" || rm -f "$FILE_PATH"
          set -e

      - name: Wipe Workspace Traces
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true
          rm -rf downloaded_video/
          rm -f cookies.txt
