name: 🎬 Download Video (Ultra Reliable + Auto-Delete)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '🔗 لینک صفحه یا ویدیو'
        required: true
        type: string
      quality:
        description: '🎬 کیفیت ویدیو (best=بهترین, worst=پایین‌ترین)'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 1080
          - 720
          - 480
          - 360
          - 240
          - 144
          - worst

jobs:
  download:
    name: "📥 Fetch Video"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Start Cloudflare WARP (Anti-Block)
        run: |
          docker network create warp-net || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp
          sleep 15

      - name: Install Dependencies (Deno & yt-dlp)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg curl jq
          
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          
          pip3 install --upgrade git+https://github.com/yt-dlp/yt-dlp.git

      - name: Download Video (Ultimate Reliability)
        run: |
          mkdir -p downloaded_video
          export PATH="$HOME/.deno/bin:$PATH"
          
          URL="${{ github.event.inputs.video_url }}"
          QUAL="${{ github.event.inputs.quality }}"
          
          if [ "$QUAL" = "best" ]; then
            FORMAT="bestvideo+bestaudio/best"
          elif [ "$QUAL" = "worst" ]; then
            FORMAT="worstvideo+worstaudio/worst"
          else
            FORMAT="bestvideo[height<=$QUAL]+bestaudio/best[height<=$QUAL]/best"
          fi

          echo "Target URL: $URL"
          echo "Selected Quality: $QUAL"

          FLAGS="--format $FORMAT --merge-output-format mp4 --restrict-filenames --no-playlist -o downloaded_video/%(title)s.%(ext)s --no-check-certificates"
          
          SUCCESS=false
          
          echo "▶️ Trying Method 1 (Android Client + WARP)..."
          if yt-dlp --proxy "socks5://127.0.0.1:1080" $FLAGS --extractor-args "youtube:player_client=android" "$URL"; then
            SUCCESS=true
          fi
          
          if [ "$SUCCESS" = false ]; then
            echo "▶️ Trying Method 2 (Web Client + Deno + WARP)..."
            if yt-dlp --proxy "socks5://127.0.0.1:1080" $FLAGS --extractor-args "youtube:player_client=web" --js-runtimes deno "$URL"; then
              SUCCESS=true
            fi
          fi
          
          if [ "$SUCCESS" = false ]; then
            echo "▶️ Trying Method 3 (Direct / No Proxy)..."
            if yt-dlp $FLAGS "$URL"; then
              SUCCESS=true
            fi
          fi
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ All download methods failed. Video might be private or region-locked."
            exit 1
          fi

      - name: Upload to Ephemeral Storage (GoFile & File.io)
        run: |
          FILE_PATH=$(find downloaded_video -type f | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "❌ No file found to upload!"
            exit 1
          fi
          
          echo "📤 File found: $FILE_PATH"
          
          # ---- 1st Attempt: file.io (Extremely reliable for < 100MB, auto-deletes after 1 download) ----
          echo "▶️ Trying File.io..."
          FILEIO_RESP=$(curl -s -F "file=@$FILE_PATH" https://file.io)
          FILEIO_LINK=$(echo "$FILEIO_RESP" | jq -r '.link' 2>/dev/null)
          
          if [ -n "$FILEIO_LINK" ] && [ "$FILEIO_LINK" != "null" ]; then
            echo "=========================================================="
            echo "✅ FILE.IO LINK: $FILEIO_LINK"
            echo "⚠️ This link will SELF-DESTRUCT after EXACTLY ONE download!"
            echo "=========================================================="
          else
            echo "⚠️ File.io failed. Response was: $FILEIO_RESP"
            
            # ---- 2nd Attempt: GoFile.io (Extremely reliable for ANY file size, no limits) ----
            echo "▶️ Trying GoFile.io..."
            # GoFile requires you to get the best server first
            SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name' 2>/dev/null)
            
            if [ -n "$SERVER" ] && [ "$SERVER" != "null" ]; then
              GOFILE_RESP=$(curl -s -F "file=@$FILE_PATH" "https://${SERVER}.gofile.io/contents/uploadfile")
              GOFILE_LINK=$(echo "$GOFILE_RESP" | jq -r '.data.downloadPage' 2>/dev/null)
              
              if [ -n "$GOFILE_LINK" ] && [ "$GOFILE_LINK" != "null" ]; then
                echo "=========================================================="
                echo "✅ GOFILE LINK: $GOFILE_LINK"
                echo "⚠️ GoFile automatically deletes files after inactivity."
                echo "=========================================================="
              else
                echo "⚠️ GoFile upload failed. Response was: $GOFILE_RESP"
                
                # ---- 3rd Attempt: BashUpload (Fallback) ----
                echo "▶️ Trying BashUpload..."
                BASH_LINK=$(curl -s -T "$FILE_PATH" https://bashupload.com/ | grep -oP 'https://bashupload.com/[^\s]+' | head -n 1)
                echo "=========================================================="
                echo "✅ BASHUPLOAD LINK: $BASH_LINK"
                echo "=========================================================="
              fi
            else
              echo "❌ Failed to fetch GoFile server."
              exit 1
            fi
          fi
          
          echo "🧹 Securely shredding the file from GitHub server..."
          shred -u "$FILE_PATH" || rm -f "$FILE_PATH"

      - name: Wipe Workspace Traces
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true
          rm -rf downloaded_video/
