name: 🎬 Download Video (Ultra Reliable + AES-256 Encrypted)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: '🔗 لینک صفحه یا ویدیو'
        required: true
        type: string
      quality:
        description: '🎬 کیفیت ویدیو'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 1080
          - 720
          - 480
          - 360
          - 240
          - 144
          - worst
      password:
        description: '🔒 رمز عبور فایل (اگر خالی بگذارید، رمز تصادفی قدرتمند ساخته می‌شود)'
        required: false
        type: string

jobs:
  download:
    name: "📥 Fetch & Encrypt Video"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Start Cloudflare WARP (Anti-Block)
        run: |
          docker network create warp-net || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp
          sleep 15

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg curl jq p7zip-full
          
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          
          pip3 install --upgrade git+https://github.com/yt-dlp/yt-dlp.git

      - name: Download Video
        run: |
          mkdir -p downloaded_video
          export PATH="$HOME/.deno/bin:$PATH"
          
          URL="${{ github.event.inputs.video_url }}"
          QUAL="${{ github.event.inputs.quality }}"
          
          if [ "$QUAL" = "best" ]; then
            FORMAT="bestvideo+bestaudio/best"
          elif [ "$QUAL" = "worst" ]; then
            FORMAT="worstvideo+worstaudio/worst"
          else
            FORMAT="bestvideo[height<=$QUAL]+bestaudio/best[height<=$QUAL]/best"
          fi

          FLAGS="--format $FORMAT --merge-output-format mp4 --restrict-filenames --no-playlist -o downloaded_video/%(title)s.%(ext)s --no-check-certificates"
          
          SUCCESS=false
          
          echo "▶️ Trying Method 1 (Android Client + WARP)..."
          if yt-dlp --proxy "socks5://127.0.0.1:1080" $FLAGS --extractor-args "youtube:player_client=android" "$URL"; then
            SUCCESS=true
          elif yt-dlp --proxy "socks5://127.0.0.1:1080" $FLAGS --extractor-args "youtube:player_client=web" --js-runtimes deno "$URL"; then
            SUCCESS=true
          elif yt-dlp $FLAGS "$URL"; then
            SUCCESS=true
          fi
          
          if [ "$SUCCESS" = false ]; then
            echo "❌ All download methods failed."
            exit 1
          fi

      - name: Encrypt Video (Zero-Knowledge Security)
        id: encrypt
        run: |
          FILE_PATH=$(find downloaded_video -type f | head -n 1)
          if [ -z "$FILE_PATH" ]; then
            echo "❌ No file found!"
            exit 1
          fi
          
          USER_PASS="${{ github.event.inputs.password }}"
          if [ -z "$USER_PASS" ]; then
            USER_PASS=$(openssl rand -hex 4)
          fi
          
          echo "🔒 Encrypting file with AES-256..."
          # -mhe=on encrypts header/file names so nobody can even see the name of the downloaded video!
          7z a -p"$USER_PASS" -mhe=on downloaded_video/Secure_Video.7z "$FILE_PATH"
          
          echo "🧹 Shredding original unencrypted video..."
          shred -u "$FILE_PATH" || rm -f "$FILE_PATH"
          
          echo "password=$USER_PASS" >> $GITHUB_OUTPUT

      - name: Upload to Ephemeral Storage
        run: |
          FILE_PATH="downloaded_video/Secure_Video.7z"
          PASS="${{ steps.encrypt.outputs.password }}"
          
          echo "▶️ Trying File.io..."
          FILEIO_RESP=$(curl -s -F "file=@$FILE_PATH" https://file.io)
          FILEIO_LINK=$(echo "$FILEIO_RESP" | jq -r '.link' 2>/dev/null)
          
          if [ -n "$FILEIO_LINK" ] && [ "$FILEIO_LINK" != "null" ]; then
            echo "=========================================================="
            echo "✅ FILE.IO LINK: $FILEIO_LINK"
            echo "⚠️ این لینک بعد از [یک بار دانلود] پاک می‌شود!"
          else
            echo "▶️ Trying GoFile.io..."
            SERVER=$(curl -s https://api.gofile.io/servers | jq -r '.data.servers[0].name' 2>/dev/null)
            if [ -n "$SERVER" ] && [ "$SERVER" != "null" ]; then
              GOFILE_RESP=$(curl -s -F "file=@$FILE_PATH" "https://${SERVER}.gofile.io/contents/uploadfile")
              GOFILE_LINK=$(echo "$GOFILE_RESP" | jq -r '.data.downloadPage' 2>/dev/null)
              
              if [ -n "$GOFILE_LINK" ] && [ "$GOFILE_LINK" != "null" ]; then
                echo "=========================================================="
                echo "✅ GOFILE LINK: $GOFILE_LINK"
              else
                echo "▶️ Trying BashUpload..."
                BASH_LINK=$(curl -s -T "$FILE_PATH" https://bashupload.com/ | grep -oP 'https://bashupload.com/[^\s]+' | head -n 1)
                echo "=========================================================="
                echo "✅ BASHUPLOAD LINK: $BASH_LINK"
              fi
            fi
          fi
          
          echo "=========================================================="
          echo "🔑 رمز عبور فایل شما برای استخراج: $PASS"
          echo "=========================================================="
          echo "⚠️ حتماً رمز بالا را کپی کنید. بدون آن فایل باز نخواهد شد!"
          
          echo "🧹 Securely shredding the encrypted archive..."
          shred -u "$FILE_PATH" || rm -f "$FILE_PATH"

      - name: Wipe Workspace Traces
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true
          rm -rf downloaded_video/
