name: 🎵 Download Song (Pro Max)

on:
  workflow_dispatch:
    inputs:
      song_name:
        description: '🎵 نام آهنگ (مثال: Metallica Harvester of Sorrow)'
        required: true
        default: 'Harvester of Sorrow'
        type: string

jobs:
  download:
    name: "📥 Fetch Audio"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Start Cloudflare WARP (Anti-Block)
        run: |
          docker network create warp-net || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            caomingjun/warp
          sleep 15

      - name: Install Deno & Latest yt-dlp (Nightly/Master)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg curl
          
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          
          pip3 install --upgrade git+https://github.com/yt-dlp/yt-dlp.git

      - name: Download Audio
        run: |
          mkdir -p downloaded_song
          export PATH="$HOME/.deno/bin:$PATH"

          SEARCH="ytsearch1:${{ github.event.inputs.song_name }} audio"
          SC_SEARCH="scsearch1:${{ github.event.inputs.song_name }}"
          # Added restrict-filenames and changed output path to be safe
          FLAGS="--extract-audio --audio-format mp3 --audio-quality 0 --restrict-filenames --no-cache-dir -o downloaded_song/%(title)s.%(ext)s --no-playlist --no-check-certificates"

          SUCCESS=false
          
          # Priority 1 is now the Android client (previously Method 3)
          for METHOD in 1 2 3 4 5 6 7 8 9; do
            echo "====================================="
            echo "Trying download method $METHOD..."
            case $METHOD in
              1) yt-dlp --proxy "socks5://127.0.0.1:1080" $FLAGS --extractor-args "youtube:player_client=android" --user-agent "Mozilla/5.0 (Linux; Android 12; SM-S906N Build/QP1A.190711.020) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Mobile Safari/537.36" "$SEARCH" && SUCCESS=true ;;
              2) yt-dlp --proxy "socks5://127.0.0.1:1080" $FLAGS --extractor-args "youtube:player_client=web" --js-runtimes deno --remote-components ejs:github --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" --add-header "Accept-Language:en-US,en;q=0.9" "$SEARCH" && SUCCESS=true ;;
              3) yt-dlp --proxy "socks5://127.0.0.1:1080" $FLAGS --extractor-args "youtube:player_client=web" --js-runtimes deno --remote-components ejs:npm --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" --add-header "Accept-Language:en-US,en;q=0.9" "$SEARCH" && SUCCESS=true ;;
              4) yt-dlp --proxy "socks5://127.0.0.1:1080" $FLAGS --extractor-args "youtube:player_client=web,mweb,android_vr" --js-runtimes deno --remote-components ejs:github "$SEARCH" && SUCCESS=true ;;
              5) yt-dlp --proxy "socks5://127.0.0.1:1080" $FLAGS --extractor-args "youtube:player_client=mweb" "$SEARCH" && SUCCESS=true ;;
              6) yt-dlp $FLAGS --extractor-args "youtube:player_client=android" "$SEARCH" && SUCCESS=true ;;
              7) yt-dlp $FLAGS --extractor-args "youtube:player_client=ios" "$SEARCH" && SUCCESS=true ;;
              8) yt-dlp $FLAGS --extractor-args "youtube:player_client=web" --js-runtimes deno "$SEARCH" && SUCCESS=true ;;
              9) echo "YouTube blocked all clients. Falling back to SoundCloud..."
                 yt-dlp $FLAGS "$SC_SEARCH" && SUCCESS=true ;;
            esac

            if [ "$SUCCESS" = true ]; then
              FILE_COUNT=$(ls -1q downloaded_song/ 2>/dev/null | wc -l)
              if [ "$FILE_COUNT" -gt 0 ]; then
                echo "✅ Download successful with method $METHOD and file exists!"
                ls -lh downloaded_song/
                break
              else
                echo "⚠️ Method $METHOD returned success, but no file found! Retrying next method..."
                SUCCESS=false
              fi
            fi
            sleep 2
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ All download methods failed."
            exit 1
          fi

      - name: Stop WARP
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-song
          path: downloaded_song/*
          retention-days: 5
